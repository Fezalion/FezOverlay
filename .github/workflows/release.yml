name: Build and Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to rebuild (e.g. v1.0.19)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  publish-tauri:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "windows-latest"
            args: ""

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Resolve release tag
        id: release
        shell: pwsh
        run: |
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            $tag = "${{ inputs.tag }}"
          } else {
            $tag = "${{ github.ref_name }}"
          }

          if ($tag -notmatch '^v.+') {
            throw "Invalid release tag: $tag"
          }

          echo "tag=$tag" >> $env:GITHUB_OUTPUT
          echo "version=$($tag -replace '^v', '')" >> $env:GITHUB_OUTPUT
          echo "Release tag: $tag"

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.release.outputs.tag }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Generate changelog from commits
        id: changelog
        shell: pwsh
        run: |
          $currentTag = "${{ steps.release.outputs.tag }}"
          Write-Host "Current tag: $currentTag"

          $allTags = git tag --sort=-creatordate
          $previousTag = $null

          if ($allTags) {
            $tagsArray = $allTags -split "`n" | Where-Object { $_ -ne $currentTag }
            if ($tagsArray -and $tagsArray.Count -gt 0) {
              $previousTag = $tagsArray[0].Trim()
            }
          }

          if ($previousTag) {
            $range = "$previousTag..$currentTag"
          } else {
            $range = "$currentTag"
          }

          Write-Host "Commit range: $range"

          $commits = git log --pretty=format:'%h %s (%an)' $range

          if (-not $commits) {
            $body = "No changes listed for this release."
          } else {
            $body = "## Changelog`n`n"
            $body += ($commits -split "`n" | ForEach-Object { "- $_`n" }) -join ""
          }

          Write-Host "Generated changelog:`n$body"

          echo "changelog<<EOF" >> $env:GITHUB_OUTPUT
          echo $body >> $env:GITHUB_OUTPUT
          echo "EOF" >> $env:GITHUB_OUTPUT

      - name: Install Rust Stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install Linux Dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Install Frontend Dependencies
        run: npm install

      - name: Build and Publish Tauri Application
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ steps.release.outputs.tag }}
          releaseName: "FezOverlay ${{ steps.release.outputs.tag }}"
          releaseBody: |
            ${{ steps.changelog.outputs.changelog }}
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}